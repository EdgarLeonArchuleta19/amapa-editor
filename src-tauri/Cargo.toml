[package]
name = "amapa-editor"
version = "1.0.0"
description = "AMAPA — Editor de Video Nativo en Rust y Tauri 2"
authors = ["Edgar León Archuleta <leonedgar190@gmail.com>"]
license = "MIT"
repository = "https://github.com/EdgarLeonArchuleta19/amapa-editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "amapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
